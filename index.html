<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="google-site-verification" content="S4yj26laybYjHTBWA5u_2ey7dSgZ4F_5I22864VlCMU" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Tools | Ваша Экосистема Утилит</title>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    
    <style>
        /* ==================== ОСНОВНЫЕ СТИЛИ ==================== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin-top: 60px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        h1 { color: #1a73e8; text-align: center; margin-bottom: 10px; }

        /* ==================== АВТОРИЗАЦИЯ ==================== */
        .auth-nav { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        #authBtn {
            background-color: #1a73e8; color: white; border: none; padding: 10px 20px;
            border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 24px; }
        .auth-form input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .google-btn { background: white; color: #757575; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; width: 100%; cursor: pointer; padding: 10px; border-radius: 6px; }

        /* ==================== ТАБЫ ==================== */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; overflow-x: auto; }
        .tab-button { background: transparent; border: none; padding: 10px 15px; cursor: pointer; font-size: 16px; color: #555; white-space: nowrap; }
        .tab-button.active { color: #1a73e8; border-bottom: 3px solid #1a73e8; font-weight: 600; }
        .tab-content { display: none; padding-top: 20px; }
        .tab-content.active { display: block; }

        /* ==================== ИСТОРИЯ ==================== */
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; }
        .history-item .date { color: #888; font-size: 12px; }
        .history-item .tool-tag { display: inline-block; background: #e9f0ff; color: #1a73e8; padding: 2px 8px; border-radius: 4px; margin-right: 10px; font-weight: bold; }

        /* Элементы форм */
        input[type="text"], input[type="file"], #textInput {
            width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        #textInput { min-height: 150px; outline: none; -webkit-user-modify: read-write; border: 1px solid #eee; padding: 10px; border-radius: 8px; }
        .primary-btn { background: #1a73e8; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; cursor: pointer; font-size: 16px; }
        .primary-btn:hover { background: #0c5bb5; }
        
        .footer-copyright { margin: 20px 0; font-size: 14px; color: #777; }
        .footer-copyright a { color: #1a73e8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="auth-nav">
        <button id="authBtn">Вход / Регистрация</button>
    </nav>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <div id="loginForm">
                <h2>Вход</h2>
                <div class="auth-form">
                    <input type="email" id="loginEmail" placeholder="Email">
                    <input type="password" id="loginPassword" placeholder="Пароль">
                    <button class="primary-btn" id="btnLogin">Войти</button>
                </div>
                <button class="google-btn" id="btnGoogle">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google
                </button>
                <p style="text-align:center; cursor:pointer; color:#1a73e8; margin-top:15px;" id="toRegister">Нет аккаунта? Регистрация</p>
            </div>
            <div id="registerForm" style="display:none">
                <h2>Регистрация</h2>
                <div class="auth-form">
                    <input type="email" id="regEmail" placeholder="Email">
                    <input type="password" id="regPassword" placeholder="Пароль">
                    <button class="primary-btn" id="btnRegister">Создать</button>
                </div>
                <p style="text-align:center; cursor:pointer; color:#1a73e8; margin-top:15px;" id="toLogin">Есть аккаунт? Войти</p>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Neuron Tools ⚡</h1>
        <div class="tabs">
            <button class="tab-button" id="defaultOpen" onclick="openTab(event, 'textAnalyzer')">Текст</button>
            <button class="tab-button" onclick="openTab(event, 'qrGenerator')">QR-код</button>
            <button class="tab-button" onclick="openTab(event, 'exifViewer')">EXIF</button>
            <button class="tab-button" onclick="openTab(event, 'historyTab')">История</button>
        </div>

        <div id="textAnalyzer" class="tab-content">
            <div id="textInput" contenteditable="true" spellcheck="true" oninput="analyzeText()" placeholder="Введите текст..."></div>
            <button class="primary-btn" onclick="saveTextHistory()">Сохранить результат в историю</button>
            <div id="statsContainer" style="margin-top:15px;">
                <p>Слов: <strong id="wordCount">0</strong></p>
                <p>Символов: <strong id="charCount">0</strong></p>
            </div>
        </div>

        <div id="qrGenerator" class="tab-content">
            <input type="text" id="dataInput" placeholder="Введите ссылку или текст">
            <button class="primary-btn" onclick="generateQR()">Сгенерировать QR</button>
            <div id="qrOutputContainer" style="display:none; text-align:center; margin-top:15px;">
                <canvas id="qrCombinedCanvas"></canvas>
                <div id="qrcode-hidden" style="display:none"></div>
            </div>
        </div>

        <div id="exifViewer" class="tab-content">
            <input type="file" id="imageInput" accept="image/*">
            <div id="exifData" style="display:none; background:#f9f9f9; padding:15px; border-radius:8px;">
                <p><strong>Модель:</strong> <span id="exifModel"></span></p>
                <p><strong>Параметры:</strong> <span id="exifDetails"></span></p>
            </div>
        </div>

        <div id="historyTab" class="tab-content">
            <h2 style="font-size: 18px;">Ваша активность</h2>
            <div id="historyList">Загрузка данных...</div>
        </div>
    </div>

    <footer class="footer-copyright">
        <a href="https://neuron-p2p.ru" target="_blank">Neuron Ecosystem</a> 2026©
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOaDVzzPjyYm4HWMND2XYWjLy_h4wty5s",
            authDomain: "neuron-ecosystem-2025.firebaseapp.com",
            projectId: "neuron-ecosystem-2025",
            storageBucket: "neuron-ecosystem-2025.firebasestorage.app",
            messagingSenderId: "589834476565",
            appId: "1:589834476565:web:93be55550691e447dd421c",
            measurementId: "G-SWHLMF6BC9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.saveToHistory = async function(tool, content) {
            const user = auth.currentUser;
            const data = { tool, content, timestamp: new Date().toISOString() };
            
            if (user) {
                try {
                    await addDoc(collection(db, "tools_history"), {
                        uid: user.uid,
                        tool: tool,
                        content: content,
                        timestamp: serverTimestamp()
                    });
                } catch (e) { console.error("Firebase error:", e); }
            } else {
                let local = JSON.parse(localStorage.getItem('neuron_history') || '[]');
                local.unshift(data);
                localStorage.setItem('neuron_history', JSON.stringify(local.slice(0, 20)));
            }
            if(document.getElementById('historyTab').style.display === 'block') loadHistory();
        };

        window.loadHistory = async function() {
            const list = document.getElementById('historyList');
            list.innerHTML = 'Загрузка...';
            const user = auth.currentUser;
            let items = [];

            if (user) {
                const q = query(collection(db, "tools_history"), where("uid", "==", user.uid), orderBy("timestamp", "desc"));
                try {
                    const snap = await getDocs(q);
                    snap.forEach(doc => items.push(doc.data()));
                } catch(e) { console.log("History restricted or empty"); }
            } else {
                items = JSON.parse(localStorage.getItem('neuron_history') || '[]');
            }

            if (items.length === 0) { list.innerHTML = 'История пуста'; return; }

            list.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const date = item.timestamp?.seconds ? new Date(item.timestamp.seconds * 1000).toLocaleString() : new Date(item.timestamp).toLocaleString();
                div.innerHTML = `<span class="tool-tag">${item.tool}</span> <span class="date">${date}</span><br>
                                 <small style="color:#555">${typeof item.content === 'object' ? JSON.stringify(item.content) : item.content}</small>`;
                list.appendChild(div);
            });
        };

        // Auth listeners
        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value).then(()=>authModal.style.display='none').catch(e=>alert(e.message));
        document.getElementById('btnRegister').onclick = () => createUserWithEmailAndPassword(auth, regEmail.value, regPassword.value).then(()=>authModal.style.display='none').catch(e=>alert(e.message));
        document.getElementById('btnGoogle').onclick = () => signInWithPopup(auth, provider).then(()=>authModal.style.display='none');
        document.getElementById('authBtn').onclick = () => auth.currentUser ? signOut(auth) : authModal.style.display='flex';
        
        onAuthStateChanged(auth, user => {
            authBtn.textContent = user ? `Выйти (${user.email.split('@')[0]})` : 'Вход / Регистрация';
            if(document.getElementById('historyTab').style.display === 'block') loadHistory();
        });

        toRegister.onclick = () => { loginForm.style.display='none'; registerForm.style.display='block'; };
        toLogin.onclick = () => { loginForm.style.display='block'; registerForm.style.display='none'; };
        closeModal.onclick = () => authModal.style.display='none';
    </script>

    <script>
        function openTab(evt, name) {
            let contents = document.getElementsByClassName("tab-content");
            for (let c of contents) c.style.display = "none";
            let tabs = document.getElementsByClassName("tab-button");
            for (let t of tabs) t.classList.remove("active");
            document.getElementById(name).style.display = "block";
            evt.currentTarget.classList.add("active");
            if(name === 'historyTab' && window.loadHistory) window.loadHistory();
        }

        function analyzeText() {
            const txt = document.getElementById('textInput').innerText.trim();
            document.getElementById('wordCount').textContent = txt ? txt.split(/\s+/).length : 0;
            document.getElementById('charCount').textContent = txt.length;
        }

        function saveTextHistory() {
            const txt = document.getElementById('textInput').innerText.trim();
            if(txt.length < 2) return;
            window.saveToHistory('Анализ текста', { chars: txt.length, preview: txt.substring(0, 40) + "..." });
            alert("Сохранено!");
        }

        function generateQR() {
            const val = document.getElementById('dataInput').value.trim();
            if(!val) return alert("Введите данные");
            
            const hiddenContainer = document.getElementById('qrcode-hidden');
            hiddenContainer.innerHTML = '';
            
            const qr = new QRCode(hiddenContainer, {
                text: val,
                width: 256,
                height: 256,
                correctLevel: QRCode.CorrectLevel.H
            });

            // Небольшая задержка, чтобы QRCode успел сгенерировать img/canvas
            setTimeout(() => {
                const canvas = document.getElementById('qrCombinedCanvas');
                const ctx = canvas.getContext('2d');
                const sourceImg = hiddenContainer.querySelector('img') || hiddenContainer.querySelector('canvas');
                
                canvas.width = 256;
                canvas.height = 290;
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, 256, 290);
                
                // Рисуем сам QR
                ctx.drawImage(sourceImg, 0, 0, 256, 256);
                
                // Подпись
                ctx.fillStyle = "#1a73e8";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Neuron Ecosystem", 128, 278);
                
                document.getElementById('qrOutputContainer').style.display = 'block';
                window.saveToHistory('Генерация QR', { data: val });
            }, 100);
        }

        document.getElementById('imageInput').onchange = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            EXIF.getData(file, function() {
                const model = EXIF.getTag(this, "Model") || "Неизвестно";
                const make = EXIF.getTag(this, "Make") || "";
                document.getElementById('exifModel').textContent = make + " " + model;
                document.getElementById('exifDetails').textContent = `Размер: ${(file.size/1024).toFixed(1)} KB`;
                document.getElementById('exifData').style.display = 'block';
                window.saveToHistory('EXIF просмотр', { file: file.name, model: model });
            });
        };

        window.onload = () => document.getElementById('defaultOpen').click();
    </script>
</body>
</html>
